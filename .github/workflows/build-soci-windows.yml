name: Build SOCI 4.0.3 Windows DLL (MSVC 2015 / v140) + SQLite

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      matrix:
        config: [Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSVC v140 (VS 2015) toolset + compatible SDK
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" -OutFile vs_buildtools.exe
          Start-Process -FilePath .\vs_buildtools.exe -ArgumentList `
            "--quiet", "--wait", "--norestart", "--nocache", `
            "--add", "Microsoft.VisualStudio.Component.VC.140", `
            "--add", "Microsoft.VisualStudio.Component.Windows10SDK.19041" `
            -Wait -NoNewWindow
          Write-Host "v140 + SDK 19041 install attempted"

      - name: Download SOCI 4.0.3 source
        run: |
          Invoke-WebRequest -Uri "https://github.com/SOCI/soci/archive/refs/tags/v4.0.3.zip" -OutFile soci-4.0.3.zip
          Expand-Archive soci-4.0.3.zip -DestinationPath .
          Rename-Item -Path "soci-4.0.3" -NewName "soci"

      - name: Download and build SQLite amalgamation
        run: |
          Invoke-WebRequest -Uri "https://www.sqlite.org/2024/sqlite-amalgamation-3470000.zip" -OutFile sqlite.zip
          Expand-Archive sqlite.zip -DestinationPath sqlite-src
          $sqliteDir = (Get-ChildItem sqlite-src -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Path sqlite-build -Force | Out-Null
          Set-Location sqlite-build
          cmake -G "Visual Studio 17 2022" -A x64 -T v140 -DCMAKE_BUILD_TYPE=Release `
            -DSQLite3_INCLUDE_DIR="$sqliteDir" `
            -DSQLite3_LIBRARY="sqlite3.lib" `
            "$sqliteDir"
          # Build sqlite3 as static lib from amalgamation
          cl /c /O2 /MD /DSQLITE_ENABLE_COLUMN_METADATA /DSQLITE_ENABLE_JSON1 "$sqliteDir\sqlite3.c"
          lib sqlite3.obj /OUT:sqlite3.lib
          Copy-Item "$sqliteDir\sqlite3.h" .
          Set-Location ..

      - name: Configure with CMake (v140 + SQLite)
        run: |
          mkdir build
          cd build
          cmake ../soci -G "Visual Studio 17 2022" -A x64 -T v140 `
            -DSOCI_SHARED=ON `
            -DSOCI_STATIC=OFF `
            -DSOCI_TESTS=OFF `
            -DSOCI_SQLITE3=ON `
            -DSQLITE3_INCLUDE_DIR="${{ github.workspace }}/sqlite-build" `
            -DSQLITE3_LIBRARY="${{ github.workspace }}/sqlite-build/sqlite3.lib" `
            -DSOCI_MYSQL=OFF `
            -DSOCI_POSTGRESQL=OFF `
            -DSOCI_ODBC=OFF `
            -DSOCI_ORACLE=OFF `
            -DSOCI_FIREBIRD=OFF `
            -DSOCI_DB2=OFF `
            -DWITH_BOOST=OFF `
            -DCMAKE_CXX_STANDARD=11

      - name: Force older Windows SDK in project files
        run: |
          Get-ChildItem -Path build -Recurse -Filter "*.vcxproj" | ForEach-Object {
            (Get-Content $_.FullName) -replace '<WindowsTargetPlatformVersion>.*</WindowsTargetPlatformVersion>', '<WindowsTargetPlatformVersion>10.0.19041.0</WindowsTargetPlatformVersion>' | Set-Content $_.FullName
          }
          Write-Host "Patched WindowsTargetPlatformVersion to 10.0.19041.0"

      - name: Build
        run: |
          cd build
          cmake --build . --config ${{ matrix.config }} --parallel

      - name: Collect artifacts
        run: |
          mkdir artifacts
          Get-ChildItem -Path build -Recurse -Filter "*.dll" | Copy-Item -Destination "artifacts\" -ErrorAction SilentlyContinue
          Get-ChildItem -Path build -Recurse -Filter "*.lib" | Copy-Item -Destination "artifacts\" -ErrorAction SilentlyContinue
          Copy-Item -Path "sqlite-build\sqlite3.dll" -Destination "artifacts\" -ErrorAction SilentlyContinue
          Copy-Item -Path "sqlite-build\sqlite3.lib" -Destination "artifacts\" -ErrorAction SilentlyContinue
          Copy-Item -Path "soci\include" -Destination "artifacts\include" -Recurse
          if (Test-Path "build\include") {
            Copy-Item -Path "build\include\*" -Destination "artifacts\include\" -Recurse -ErrorAction SilentlyContinue
          }
          Write-Host "=== Collected files ==="
          Get-ChildItem -Path artifacts -Recurse | Select-Object FullName, Length

      - name: Upload Windows DLL package
        uses: actions/upload-artifact@v4
        with:
          name: soci-4.0.3-windows-dll-v140-sqlite-${{ matrix.config }}
          path: artifacts/
          retention-days: 30
